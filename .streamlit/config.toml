[theme]
base = "dark"
font = "sans-serif"
baseRadius = "large"
buttonRadius = "large"
showSidebarBorder = true

[theme.dark]
primaryColor = "#C7F464"
backgroundColor = "#0B0C09"
secondaryBackgroundColor = "#1A1B15"
textColor = "#F3F1E8"
borderColor = "#35372D"

[theme.dark.sidebar]
backgroundColor = "#10110D"
secondaryBackgroundColor = "#1A1B15"
textColor = "#F3F1E8"
primaryColor = "#C7F464"

[theme.light]
primaryColor = "#648B20"
backgroundColor = "#F6F6EF"
secondaryBackgroundColor = "#EBECE2"
textColor = "#24251F"
borderColor = "#D7D8CC"

[theme.light.sidebar]
backgroundColor = "#EFF0E7"
secondaryBackgroundColor = "#E5E7DC"
textColor = "#24251F"
primaryColor = "#648B20"

[server]
maxUploadSize = 20
